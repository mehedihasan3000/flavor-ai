version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: flavorai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: flavorai
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flavorai-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/flavorai
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: dev-production-jwt-secret-replace-in-real-env
      JWT_ISSUER: flavorai
      JWT_AUDIENCE: flavorai-api
      JWT_EXPIRES_IN: 15m
      GROQ_API_KEY: ${GROQ_API_KEY:-change-me}
      GROQ_MODEL: openai/gpt-oss-120b
      AI_REQUEST_TIMEOUT_MS: 30000
      IMGBB_API_KEY: ${IMGBB_API_KEY:-change-me}
      IMGBB_API_URL: https://api.imgbb.com/1/upload
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flavorai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      JWT_SECRET: dev-production-jwt-secret-replace-in-real-env
    depends_on:
      - backend

volumes:
  mongo_data:
